<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Viewer</title>
    <!-- Simple responsive styling -->
    <link rel="stylesheet" href="style.css">
    <!-- Highlight.js CSS for code blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>
<body>
    <header class="toolbar">
        <button id="menu-toggle" class="hamburger" aria-label="Menu">&#9776;</button>
        <div class="toolbar-title">Lab Viewer</div>
        <div class="theme-controls">
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme" title="Toggle Theme">🌙</button>
        </div>
        <div class="font-controls">
            <button id="font-decrease" class="font-btn" aria-label="Decrease Font Size" title="Decrease Font Size">A-</button>
            <button id="font-increase" class="font-btn" aria-label="Increase Font Size" title="Increase Font Size">A+</button>
        </div>
    </header>

    <nav id="side-menu" class="side-menu">
        <div class="menu-header">
            <h2></h2>
            <button id="close-menu" class="close-btn" aria-label="Close">&times;</button>
        </div>
        <ul id="toc-list"></ul>
    </nav>

    <div id="content" class="container">
        <p>Loading lab...</p>
    </div>

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
