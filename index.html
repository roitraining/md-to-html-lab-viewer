<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Viewer</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <!-- Simple responsive styling -->
    <link rel="stylesheet" href="style.css?v=13">
    <!-- Highlight.js CSS for code blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>
<body>
    <header class="toolbar">
        <button id="menu-toggle" class="hamburger" aria-label="Menu">&#9776;</button>
        <img src="images/roi-logo-with-name.png" alt="ROI Training" class="toolbar-logo">
        <div class="toolbar-title">Lab Viewer</div>
        <button id="open-lab-btn" class="text-btn" type="button" title="Open a lab from GitHub">Open</button>
        <button id="export-docx-btn" class="icon-btn" type="button" aria-label="Export to Word (.docx)" title="Export to Word (.docx)">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="#185ABD" d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
                <path fill="#90CAF9" d="M14 2v6h6z"/>
                <path fill="#FFFFFF" d="M7.3 11.2h1.6l1 4.6 1.1-4.6h1.5l1.1 4.6 1-4.6h1.6l-1.8 6.8h-1.6l-1.1-4.3-1.1 4.3H9.1L7.3 11.2z"/>
            </svg>
        </button>
        <button id="export-pdf-btn" class="icon-btn" type="button" aria-label="Print / Export to PDF" title="Print / Export to PDF">🖨️</button>
        <div class="theme-controls">
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme" title="Toggle Theme">🌙</button>
        </div>
        <div class="font-controls">
            <button id="font-decrease" class="font-btn" aria-label="Decrease Font Size" title="Decrease Font Size">A-</button>
            <button id="font-increase" class="font-btn" aria-label="Increase Font Size" title="Increase Font Size">A+</button>
        </div>
    </header>

    <nav id="side-menu" class="side-menu">
        <div class="menu-header">
            <h2></h2>
            <button id="close-menu" class="close-btn" aria-label="Close">&times;</button>
        </div>
        <ul id="toc-list"></ul>
    </nav>

    <div id="content" class="container">
        <p class="muted-prompt">Open a lab from GitHub to get started.</p>
    </div>

    <div id="open-lab-modal" class="modal-overlay" hidden aria-hidden="true">
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="open-lab-title">
            <div class="modal-header">
                <h2 id="open-lab-title">Open Lab</h2>
                <button type="button" id="open-lab-close" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <p class="modal-help">Paste a GitHub URL to a lab folder or Markdown file (for example <code>…/labs/lab-01-…</code> or <code>…/lab.md</code>).</p>
                <label class="modal-label" for="github-lab-url">GitHub URL</label>
                <input type="url" id="github-lab-url" class="modal-text-input" placeholder="https://github.com/owner/repo/tree/main/labs/lab-01-…" autocomplete="off" spellcheck="false">
                <div id="open-lab-status" class="modal-status" role="status" aria-live="polite"></div>
            </div>
            <div class="modal-footer">
                <button type="button" id="open-lab-cancel" class="btn-secondary">Cancel</button>
                <button type="button" id="open-lab-submit" class="btn-primary">Open</button>
            </div>
        </div>
    </div>

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- docx.js for Word (.docx) Export -->
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
    <!-- App Logic -->
    <script src="app.js?v=12"></script>
</body>
</html>
